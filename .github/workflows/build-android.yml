
name: Build Pixel Jump APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Android APK
        uses: docker://ghcr.io/kivy/buildozer:latest
        env:
          BUILDOZER_ALLOW_ROOT: "1"
        with:
          args: android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Jump-APK
          path: bin/*.apk
          
